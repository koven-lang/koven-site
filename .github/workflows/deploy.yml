name: Build and deploy Koven portal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [koven-content-updated]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_repository: ${{ steps.content.outputs.repository }}
      source_sha: ${{ steps.source_identity.outputs.sha }}
      nightly: ${{ steps.content.outputs.nightly }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read reviewed content source
        id: content
        run: python3 scripts/resolve_source.py >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.content.outputs.repository }}
          ref: ${{ steps.content.outputs.ref }}
          path: .content/koven
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source identity
        id: source_identity
        run: echo "sha=$(git -C .content/koven rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require fresh successful upstream main CI
        if: steps.content.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ steps.content.outputs.repository }}
          SOURCE_SHA: ${{ steps.source_identity.outputs.sha }}
        run: python3 scripts/check_upstream.py "$SOURCE_REPOSITORY" "$SOURCE_SHA"
      - name: Read pinned API source
        id: api
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          config = json.load(open('api-source.json'))
          print('repository=' + config['repository'])
          print('revision=' + config['revision'])
          PYCODE
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.api.outputs.repository }}
          ref: ${{ steps.api.outputs.revision }}
          path: .content/api
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check documentation lifecycle contracts
        run: npm run check-docs
      - run: npm ci
      - name: Test source contracts
        run: npm test
        env:
          KOVEN_SOURCE: .content/koven
          KOVEN_REF: HEAD
          KOVEN_API_SOURCE: .content/api
      - name: Generate content from the checked out commit
        run: npm run sync-content -- --source .content/koven --ref HEAD --api-source .content/api
      - run: npm run build
      - name: Preserve review build
        uses: actions/upload-artifact@v7
        with:
          name: koven-site
          path: dist
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Recheck freshness immediately before Pages deployment
        if: needs.build.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.build.outputs.source_repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: python3 scripts/check_upstream.py "$SOURCE_REPOSITORY" "$SOURCE_SHA"
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
